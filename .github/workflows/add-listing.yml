name: Publish listing from issue

on:
  issues:
    types: [opened, edited, closed, reopened]

permissions:
  contents: write
  issues: write

# Two issues edited at once would otherwise race to push listings.json.
concurrency:
  group: listings
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only the repo owner and collaborators can publish. Without this, making the
    # repo public would let any stranger put a listing on the site by opening an issue.
    if: >-
      github.event.issue.user.login == github.repository_owner ||
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.issue.author_association)
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp

      - name: Update listings.json
        id: build
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/add_listing.py

      - name: Commit and push
        if: steps.build.outputs.status == 'changed'
        env:
          MSG: ${{ steps.build.outputs.commit_message }}
        run: |
          rm -f comment.md
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing changed on disk."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$MSG"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Report back on the issue
        if: always() && steps.build.outputs.status != 'skipped' && hashFiles('comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file comment.md

      - name: Say so if the run failed outright
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUMBER" --body \
            "Something went wrong publishing this listing, so the site is unchanged. Details: $RUN_URL"
